<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acompanhamento do Projeto · SAMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F6F2EC; --ink:#211C18; --graphite:#5C554C; --line:#E3DACD;
    --terracotta:#C1602E; --terracottaDark:#9C4A22;
    --sage:#5C6E5A; --clay:#9C6B4F; --alert:#8B3A2B;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:640px;margin:0 auto;padding:48px 24px 80px;}
  .logo{width:64px;height:64px;object-fit:contain;margin-bottom:18px;}
  .label{font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--graphite);margin:0 0 6px;}
  h1{font-size:24px;margin:0 0 4px;}
  .cliente{color:var(--graphite);font-size:14px;margin:0 0 24px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 1px 2px rgba(33,28,24,.04);margin-bottom:20px;}
  .bar{height:9px;background:var(--line);overflow:hidden;border-radius:99px;}
  .bar > div{height:100%;background:var(--terracotta);border-radius:99px;}
  .pct{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:var(--terracotta);margin:10px 0 2px;}
  .etapa{padding:12px 0;border-bottom:1px solid var(--paper);}
  .etapa:last-child{border-bottom:none;}
  .etapa-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .etapa-nome{font-size:14px;font-weight:500;}
  .etapa-status{font-size:12px;padding:2px 8px;border-radius:99px;}
  .etapa-datas{font-size:12.5px;color:var(--graphite);margin-top:4px;}
  .compromisso{padding:10px 0;border-bottom:1px solid var(--paper);font-size:13.5px;}
  .compromisso:last-child{border-bottom:none;}
  .compromisso .data{color:var(--terracotta);font-weight:600;font-family:'Space Grotesk',sans-serif;}
  .footer{text-align:center;font-size:12px;color:var(--graphite);margin-top:40px;}
  .aprov-card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .aprov-tipo{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;color:var(--terracotta);letter-spacing:.04em;}
  .aprov-titulo{font-size:15px;font-weight:600;margin:4px 0 6px;}
  .aprov-desc{font-size:13px;color:var(--graphite);margin:0 0 10px;white-space:pre-wrap;}
  .aprov-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .aprov-imgs img{width:100px;height:100px;object-fit:cover;border-radius:8px;cursor:pointer;}
  .aprov-botoes{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-aprovar{background:var(--sage);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:13px;cursor:pointer;font-weight:600;}
  .btn-ajustar{background:#fff;color:var(--alert);border:1px solid var(--alert);border-radius:9px;padding:10px 16px;font-size:13px;cursor:pointer;}
  .aprov-comentario-box{margin-top:10px;display:none;}
  .aprov-comentario-box textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;margin-bottom:8px;}
  .aprov-status-pill{font-size:12px;padding:3px 10px;border-radius:99px;display:inline-block;}
  .aprov-comentario-lido{background:var(--paper);border-radius:9px;padding:8px 10px;margin-top:8px;font-size:12.5px;}
  .checklist-item-cliente{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--paper);font-size:13.5px;cursor:pointer;}
  .checklist-item-cliente:last-child{border-bottom:none;}
  .checklist-item-cliente input{width:18px;height:18px;accent-color:var(--terracotta);flex-shrink:0;}
  .dados-contrato-form label{font-size:11.5px;color:var(--graphite);display:block;margin:8px 0 3px;}
  .dados-contrato-form input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;}
  .checklist-item-opcoes{padding:10px 0;border-bottom:1px solid var(--paper);}
  .checklist-item-opcoes:last-child{border-bottom:none;}

  /* Checklist agrupado em colunas */
  .ck-grupo{margin-bottom:22px;}
  .ck-grupo-topo{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid var(--terracotta);padding-bottom:6px;margin-bottom:10px;}
  .ck-grupo-nome{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;}
  .ck-grupo-contador{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--graphite);}
  .ck-colunas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 18px;}
  .ck-item{padding:7px 0;border-bottom:1px solid var(--paper);}
  .ck-nome{font-size:13px;display:block;margin-bottom:5px;}
  .ck-opcoes{display:flex;gap:5px;flex-wrap:wrap;}
  .ck-item-simples{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .ck-item-simples .ck-nome{margin-bottom:0;flex:1;}
  .ck-item-simples input{width:17px;height:17px;accent-color:var(--terracotta);flex-shrink:0;}
  .ck-unica{font-size:11px;color:var(--graphite);background:var(--paper);padding:2px 8px;border-radius:99px;white-space:nowrap;}

  /* Atas no portal */
  .ata-portal{border-bottom:1px solid var(--paper);}
  .ata-portal:last-child{border-bottom:none;}
  .ata-portal-topo{display:flex;justify-content:space-between;align-items:center;padding:11px 0;cursor:pointer;list-style:none;font-size:13.5px;font-weight:500;}
  .ata-portal-topo::-webkit-details-marker{display:none;}
  .ata-chevron{font-size:18px;color:var(--graphite);transition:transform .15s;}
  .ata-portal[open] .ata-chevron{transform:rotate(90deg);}
  .ata-portal-corpo{padding:0 0 14px;}
  .ata-rotulo{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--terracotta);margin:10px 0 3px;}
  .ata-texto{font-size:13px;margin:0;white-space:pre-wrap;line-height:1.55;}
  .ata-campo{font-size:12.5px;margin:0 0 4px;color:var(--graphite);}
  .checklist-item-nome{font-size:13.5px;font-weight:500;display:block;margin-bottom:6px;}
  .opcoes-pills{display:flex;gap:6px;flex-wrap:wrap;}
  .opcao-pill{font-size:12px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--graphite);cursor:pointer;}
  .opcao-pill.selecionada{background:var(--terracotta);color:#fff;border-color:var(--terracotta);}
  .fin-resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .fin-resumo div{background:var(--paper);border-radius:9px;padding:10px;text-align:center;}
  .fin-resumo p:first-child{font-size:10.5px;text-transform:uppercase;color:var(--graphite);margin:0 0 4px;font-family:'IBM Plex Mono',monospace;}
  .fin-resumo p:last-child{font-size:14px;font-weight:600;margin:0;}
  .parcela-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--paper);font-size:13px;}
  .parcela-row:last-child{border-bottom:none;}
  .parcela-status{font-size:11px;padding:3px 9px;border-radius:99px;}

  /* Lista "Entregas" (miniatura + status + expandir) */
  .entrega-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--paper);cursor:pointer;}
  .entrega-row:last-child{border-bottom:none;}
  .entrega-thumb{width:52px;height:52px;border-radius:9px;background:var(--paper) center/cover no-repeat;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--graphite);}
  .entrega-info{flex:1;min-width:0;}
  .entrega-titulo{font-size:14px;margin:0 0 3px;font-weight:500;}
  .entrega-status-linha{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--graphite);}
  .entrega-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .entrega-chevron{font-size:20px;color:var(--graphite);flex-shrink:0;transition:transform .15s;}
  .entrega-chevron.aberto{transform:rotate(90deg);}
  .entrega-detalhe{padding:0 0 14px 64px;display:none;}
  .entrega-detalhe.aberto{display:block;}
  .estado{text-align:center;padding:60px 20px;color:var(--graphite);}
</style>
</head>
<body>
<div class="wrap" id="conteudo">
  <div class="estado">Carregando...</div>
</div>

<script>
const SUPABASE_URL = "https://kyawrtkhgheqjgofjnti.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-hD_wTqLCMlLQct3DBTFZw_UvIvLHap";

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtData(d){ return new Date(d+'T00:00:00').toLocaleDateString('pt-BR'); }
function fmtMoeda(v){ return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDataHora(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

const STATUS_LABEL = { pendente:'Pendente', em_andamento:'Em andamento', concluida:'Concluída',
  em_andamento_projeto:'Em andamento', pausado:'Pausado', concluido:'Concluído', cancelado:'Cancelado' };
const STATUS_COR = { pendente:'#9C6B4F', em_andamento:'#C1602E', concluida:'#5C6E5A' };

async function iniciar(){
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const cont = document.getElementById('conteudo');

  if(!token){
    cont.innerHTML = '<div class="estado">Link inválido — peça o link correto pro escritório da SAMI.</div>';
    return;
  }
  window._token = token;
  window._sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  await carregarERenderizar();
}

async function carregarERenderizar(){
  const cont = document.getElementById('conteudo');
  const { data, error } = await window._sb.rpc('portal_dados_projeto', { p_token: window._token });

  if(error || !data){
    cont.innerHTML = '<div class="estado">Não encontramos esse projeto. O link pode ter expirado — peça um novo pro escritório da SAMI.</div>';
    return;
  }

  const p = data;

  cont.innerHTML = `
    <p class="label">SAMI · Arquitetura e Interiores</p>
    <h1>${esc(p.nome)}</h1>
    <p class="cliente">${esc(p.cliente || '')}${p.localizacao ? ' · ' + esc(p.localizacao) : ''}</p>

    <div class="card">
      <p class="label">Progresso geral</p>
      <p class="pct">${p.percentual_execucao}%</p>
      <div class="bar"><div style="width:${p.percentual_execucao}%"></div></div>
      ${p.data_prevista ? `<p style="font-size:12.5px;color:var(--graphite);margin:10px 0 0;">Previsão de entrega: ${fmtData(p.data_prevista)}</p>` : ''}
    </div>

    ${p.financeiro && (p.financeiro.parcelas||[]).length > 0 ? `
    <div class="card">
      <p class="label" style="margin-bottom:10px;">Financeiro</p>
      <div class="fin-resumo">
        <div><p>Total</p><p>${fmtMoeda(p.financeiro.total)}</p></div>
        <div><p>Pago</p><p style="color:#5C6E5A;">${fmtMoeda(p.financeiro.pago)}</p></div>
        <div><p>A pagar</p><p style="color:#C1602E;">${fmtMoeda(p.financeiro.pendente)}</p></div>
      </div>
      ${p.financeiro.parcelas.map(pc => {
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        const atrasada = pc.status!=='pago' && pc.vencimento && new Date(pc.vencimento+'T00:00:00') < hoje;
        const cor = pc.status==='pago' ? '#5C6E5A' : atrasada ? '#8B3A2B' : '#C1602E';
        const texto = pc.status==='pago' ? 'Pago' : atrasada ? 'Atrasado' : 'Pendente';
        return `<div class="parcela-row">
          <span>${esc(pc.descricao||'Parcela')} <span style="color:var(--graphite);">· ${fmtData(pc.vencimento)}</span></span>
          <span style="display:flex;align-items:center;gap:8px;">
            <b>${fmtMoeda(pc.valor)}</b>
            <span class="parcela-status" style="color:${cor};background:${cor}22;">${texto}</span>
          </span>
        </div>`;
      }).join('')}
    </div>` : ''}

    <div class="card">
      <p class="label" style="margin-bottom:14px;">Etapas do projeto</p>
      ${(p.etapas||[]).length===0 ? '<p style="color:var(--graphite);font-size:13px;">Nenhuma etapa cadastrada ainda.</p>' : p.etapas.map(e => `
        <div class="etapa">
          <div class="etapa-top">
            <span class="etapa-nome">${esc(e.nome)}</span>
            <span class="etapa-status" style="color:${STATUS_COR[e.status]};background:${STATUS_COR[e.status]}22;">${STATUS_LABEL[e.status]||e.status}</span>
          </div>
          <div class="bar" style="height:5px;"><div style="width:${e.percentual_execucao}%;background:${STATUS_COR[e.status]};"></div></div>
          ${e.data_inicio || e.data_fim ? `<p class="etapa-datas">${e.data_inicio?fmtData(e.data_inicio):'?'} → ${e.data_fim?fmtData(e.data_fim):'?'}</p>` : ''}
        </div>`).join('')}
    </div>

    ${(p.proximos_compromissos||[]).length > 0 ? `
    <div class="card">
      <p class="label" style="margin-bottom:10px;">Próximos compromissos</p>
      ${p.proximos_compromissos.map(c => `
        <div class="compromisso">
          <span class="data">${fmtDataHora(c.data_hora)}</span> — ${esc(c.titulo)}${c.local ? ' · ' + esc(c.local) : ''}
        </div>`).join('')}
    </div>` : ''}

    ${(p.atas||[]).length > 0 ? `
    <div class="card">
      <p class="label" style="margin-bottom:10px;">Registro das reuniões</p>
      ${p.atas.map(a => `
        <details class="ata-portal">
          <summary class="ata-portal-topo">
            <span>Reunião de ${fmtData(a.data)}</span>
            <span class="ata-chevron">›</span>
          </summary>
          <div class="ata-portal-corpo">
            ${a.participantes ? `<p class="ata-campo"><b>Participantes:</b> ${esc(a.participantes)}</p>` : ''}
            ${a.decisoes ? `<p class="ata-rotulo">Decisões tomadas</p><p class="ata-texto">${esc(a.decisoes)}</p>` : ''}
            ${a.pendencias ? `<p class="ata-rotulo">Pendências</p><p class="ata-texto">${esc(a.pendencias)}</p>` : ''}
            ${a.responsaveis ? `<p class="ata-campo"><b>Responsáveis:</b> ${esc(a.responsaveis)}</p>` : ''}
          </div>
        </details>`).join('')}
    </div>` : ''}

    ${(p.aprovacoes||[]).length > 0 ? `
    <div class="card">
      <p class="label" style="margin-bottom:6px;">Entregas</p>
      ${p.aprovacoes.map(a => {
        const itensCk = a.checklist_itens || [];
        const marcadosCk = itensCk.filter(i => i.marcado).length;
        const cor = a.eh_checklist
          ? (itensCk.length>0 && marcadosCk===itensCk.length ? '#5C6E5A' : '#C1602E')
          : a.status==='aprovado' ? '#5C6E5A' : a.status==='alteracoes' ? '#8B3A2B' : '#C1602E';
        const statusTexto = a.eh_checklist
          ? `${marcadosCk}/${itensCk.length} marcados`
          : a.tipo==='dados_contrato'
            ? (a.status==='pendente' ? 'Aguardando seus dados' : 'Dados enviados')
            : a.status==='aprovado' ? 'Aprovado' : a.status==='alteracoes' ? 'Alterações solicitadas' : 'Aguardando sua análise';
        const capa = (a.imagens||[])[0];
        return `
        <div class="entrega-row" onclick="toggleEntrega('${a.id}')">
          <div class="entrega-thumb" style="${capa ? `background-image:url('${esc(capa)}');` : ''}">${capa ? '' : '···'}</div>
          <div class="entrega-info">
            <p class="entrega-titulo">${esc(a.titulo)}${a.etapa_nome ? ` <span style="color:var(--graphite);font-weight:400;">· ${esc(a.etapa_nome)}</span>` : ''}</p>
            <div class="entrega-status-linha"><span class="entrega-dot" style="background:${cor};"></span>${statusTexto}</div>
          </div>
          <span class="entrega-chevron" id="chevron-${a.id}">›</span>
        </div>
        <div class="entrega-detalhe" id="detalhe-${a.id}">
          ${a.descricao ? `<p class="aprov-desc">${esc(a.descricao)}</p>` : ''}
          ${(a.imagens||[]).length>0 ? `<div class="aprov-imgs">${a.imagens.map(url => `<img src="${esc(url)}" onclick="event.stopPropagation();window.open('${esc(url)}','_blank')" />`).join('')}</div>` : ''}
          ${a.eh_checklist ? `
            <div onclick="event.stopPropagation();">
              ${renderChecklistAgrupado(itensCk)}
            </div>
          ` : a.tipo==='dados_contrato' ? `
            <div onclick="event.stopPropagation();">
              ${a.status==='pendente' ? `
                <div class="dados-contrato-form">
                  <label>Nome completo</label>
                  <input id="dc-nome-${a.id}" value="${esc(a.dados_nome||'')}" />
                  <label>CPF</label>
                  <input id="dc-cpf-${a.id}" value="${esc(a.dados_cpf||'')}" placeholder="000.000.000-00" />
                  <label>RG</label>
                  <input id="dc-rg-${a.id}" value="${esc(a.dados_rg||'')}" />
                  <button class="btn-aprovar" style="margin-top:6px;" onclick="enviarDadosContrato('${a.id}')">Enviar dados</button>
                </div>
              ` : `
                <div class="aprov-comentario-lido">
                  <p style="margin:0 0 3px;"><b>${esc(a.dados_nome||'')}</b></p>
                  <p style="margin:0;">CPF: ${esc(a.dados_cpf||'—')} · RG: ${esc(a.dados_rg||'—')}</p>
                </div>
              `}
            </div>
          ` : a.status==='pendente' ? `
            <div class="aprov-botoes" onclick="event.stopPropagation();">
              <button class="btn-aprovar" onclick="responderAprovacao('${a.id}','aprovado')">✓ Aprovar</button>
              <button class="btn-ajustar" onclick="mostrarCaixaComentario('${a.id}')">Solicitar ajuste</button>
            </div>
            <div class="aprov-comentario-box" id="comentario-box-${a.id}" onclick="event.stopPropagation();">
              <textarea id="comentario-texto-${a.id}" rows="3" placeholder="Descreva o que precisa mudar..."></textarea>
              <button class="btn-ajustar" onclick="responderAprovacao('${a.id}','alteracoes')">Enviar solicitação</button>
            </div>
          ` : `${a.comentario_cliente ? `<div class="aprov-comentario-lido">${esc(a.comentario_cliente)}</div>` : ''}`}
        </div>`;
      }).join('')}
    </div>` : ''}

    <p class="footer">Essa é uma tela somente de acompanhamento. Qualquer dúvida, fale direto com a equipe da SAMI.</p>
  `;
}

/* Monta o checklist agrupado por armário, em colunas.
   Peça com uma opção só vira caixinha de marcar; com várias, vira botões. */
function renderChecklistAgrupado(itens){
  if(!itens || itens.length===0) return '<p class="aprov-desc">Nenhum item nesse checklist.</p>';

  const grupos = new Map();
  itens.forEach(i => {
    const match = i.item.match(/^(.*)\s\(([^)]+)\)$/);
    const grupo = match ? match[2] : 'Itens';
    const nomeLimpo = match ? match[1] : i.item;
    if(!grupos.has(grupo)) grupos.set(grupo, []);
    grupos.get(grupo).push({ ...i, nomeLimpo });
  });

  return Array.from(grupos.entries()).map(([grupo, lista]) => {
    const feitos = lista.filter(x => x.marcado).length;
    return `
    <div class="ck-grupo">
      <div class="ck-grupo-topo">
        <span class="ck-grupo-nome">${esc(grupo)}</span>
        <span class="ck-grupo-contador">${feitos}/${lista.length}</span>
      </div>
      <div class="ck-colunas">
        ${lista.map(i => {
          const opcoes = i.opcoes ? i.opcoes.split(',') : [];
          if(opcoes.length === 1){
            const op = opcoes[0];
            return `<label class="ck-item ck-item-simples">
              <input type="checkbox" ${i.marcado?'checked':''} onchange="escolherOpcaoChecklist('${i.id}','${op.replace(/'/g,"\\'")}')" />
              <span class="ck-nome">${esc(i.nomeLimpo)}</span>
              <span class="ck-unica">${esc(op)}</span>
            </label>`;
          }
          if(opcoes.length === 0){
            return `<label class="ck-item ck-item-simples">
              <input type="checkbox" ${i.marcado?'checked':''} onchange="marcarItemChecklist('${i.id}', this.checked)" />
              <span class="ck-nome">${esc(i.nomeLimpo)}</span>
            </label>`;
          }
          return `<div class="ck-item">
            <span class="ck-nome">${esc(i.nomeLimpo)}</span>
            <div class="ck-opcoes">
              ${opcoes.map(op => `<button class="opcao-pill ${i.resposta_opcao===op?'selecionada':''}" onclick="escolherOpcaoChecklist('${i.id}','${op.replace(/'/g,"\\'")}')">${esc(op)}</button>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleEntrega(id){
  window._entregasAbertas = window._entregasAbertas || new Set();
  if(window._entregasAbertas.has(id)) window._entregasAbertas.delete(id);
  else window._entregasAbertas.add(id);
  document.getElementById('detalhe-'+id).classList.toggle('aberto');
  document.getElementById('chevron-'+id).classList.toggle('aberto');
}

async function marcarItemChecklist(itemId, marcado){
  const { data, error } = await window._sb.rpc('portal_marcar_item_checklist', {
    p_token: window._token, p_item_id: itemId, p_marcado: marcado,
  });
  if(error || !data){
    alert('Não consegui salvar. Tenta de novo.');
    return;
  }
  await carregarERenderizar();
  reabrirEntregasAbertas();
}

async function enviarDadosContrato(aprovacaoId){
  const nome = document.getElementById('dc-nome-'+aprovacaoId).value.trim();
  const cpf = document.getElementById('dc-cpf-'+aprovacaoId).value.trim();
  const rg = document.getElementById('dc-rg-'+aprovacaoId).value.trim();
  if(!nome || !cpf){ alert('Preenche pelo menos o nome e o CPF.'); return; }
  const { data, error } = await window._sb.rpc('portal_enviar_dados_contrato', {
    p_token: window._token, p_aprovacao_id: aprovacaoId, p_nome: nome, p_cpf: cpf, p_rg: rg || null,
  });
  if(error || !data){
    alert('Não consegui enviar. Tenta de novo.');
    return;
  }
  await carregarERenderizar();
  reabrirEntregasAbertas();
}

async function escolherOpcaoChecklist(itemId, opcao){
  const { data, error } = await window._sb.rpc('portal_escolher_opcao_checklist', {
    p_token: window._token, p_item_id: itemId, p_opcao: opcao,
  });
  if(error || !data){
    alert('Não consegui salvar. Tenta de novo.');
    return;
  }
  await carregarERenderizar();
  reabrirEntregasAbertas();
}

function reabrirEntregasAbertas(){
  (window._entregasAbertas||new Set()).forEach(id => {
    document.getElementById('detalhe-'+id)?.classList.add('aberto');
    document.getElementById('chevron-'+id)?.classList.add('aberto');
  });
}

function mostrarCaixaComentario(aprovacaoId){
  document.getElementById('comentario-box-'+aprovacaoId).style.display = 'block';
}

async function responderAprovacao(aprovacaoId, status){
  let comentario = null;
  if(status==='alteracoes'){
    comentario = document.getElementById('comentario-texto-'+aprovacaoId).value.trim();
    if(!comentario){ alert('Descreve rapidinho o que precisa mudar antes de enviar.'); return; }
  }
  const { data, error } = await window._sb.rpc('portal_responder_aprovacao', {
    p_token: window._token, p_aprovacao_id: aprovacaoId, p_status: status, p_comentario: comentario,
  });
  if(error || !data){
    alert('Não consegui enviar sua resposta. Tenta de novo ou fala com o escritório.');
    return;
  }
  await carregarERenderizar();
}

iniciar();
</script>
